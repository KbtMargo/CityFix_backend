<!-- @dsCard group="Status" height=230 subtitle="Severity pill — status, priority and category tags" -->
<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pill — preview</title>
<style>body{padding:24px;background:var(--page)} .pv-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .pv-label{display:block;margin:0 0 8px;font-size:12px;line-height:16px;font-weight:500;color:var(--slate-500)} .pv-block+.pv-block{margin-top:28px} .pv-grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));align-items:start}</style></head>
<body>
<div class="pv-block"><span class="pv-label">Рівні: high · medium · low · neutral</span><div class="pv-row"><span class="cf-pill cf-pill--high">high</span><span class="cf-pill cf-pill--medium">medium</span><span class="cf-pill cf-pill--low">low</span><span class="cf-pill cf-pill--neutral">neutral</span></div></div>
<div class="pv-block"><span class="pv-label">Статус звернення</span><div class="pv-row"><span class="cf-pill cf-pill--new">Нове</span><span class="cf-pill cf-pill--inprogress">В роботі</span><span class="cf-pill cf-pill--done">Виконано</span><span class="cf-pill cf-pill--rejected">Відхилено</span></div></div>
<div class="pv-block"><span class="pv-label">Пріоритет і категорія</span><div class="pv-row"><span class="cf-pill cf-pill--urgent">високий пріоритет</span><span class="cf-pill cf-pill--normal">середній пріоритет</span><span class="cf-pill cf-pill--low">низький пріоритет</span><span class="cf-pill cf-pill--neutral">Дороги</span></div></div>

</body>
</html>
