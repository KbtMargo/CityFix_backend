<!-- @dsCard group="Feedback" height=330 subtitle="Skeleton, Spinner, Progress (plain, coloured, multi-segment)" -->
<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loading — preview</title>
<style>body{padding:24px;background:var(--page)} .pv-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .pv-label{display:block;margin:0 0 8px;font-size:12px;line-height:16px;font-weight:500;color:var(--slate-500)} .pv-block+.pv-block{margin-top:28px} .pv-grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));align-items:start}</style></head>
<body>
<div class="pv-block"><span class="pv-label">Skeleton — бічна панель під час завантаження</span><div class="cf-stack-4" style="max-width:320px"><div class="cf-skeleton" style="height:40px"></div><div class="cf-skeleton" style="height:80px"></div><div class="cf-skeleton" style="height:48px"></div></div></div>
<div class="pv-block"><span class="pv-label">Spinner · Progress</span><div class="pv-row"><span class="cf-spinner" role="status" aria-label="Loading"></span><span class="cf-loading" style="padding:0">Завантаження ваших звернень...</span></div>
<div class="cf-stack-2" style="margin-top:16px;max-width:520px"><div class="cf-progress"><div class="cf-progress__bar" style="width:60%"></div></div><div class="cf-progress"><div class="cf-progress__bar cf-progress__bar--green" style="width:86%"></div></div>
<div class="cf-progress cf-progress--multi"><div style="width:7%;background:var(--series-blue)"></div><div style="width:17%;background:var(--series-amber)"></div><div style="width:72%;background:var(--series-emerald)"></div><div style="width:4%;background:var(--series-red)"></div></div></div></div>

</body>
</html>
