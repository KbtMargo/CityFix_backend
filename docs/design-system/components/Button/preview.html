<!-- @dsCard group="Actions" height=330 subtitle="shadcn Button — 6 variants, 3 sizes, icon buttons; AppLink" -->
<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button — preview</title>
<style>body{padding:24px;background:var(--page)} .pv-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .pv-label{display:block;margin:0 0 8px;font-size:12px;line-height:16px;font-weight:500;color:var(--slate-500)} .pv-block+.pv-block{margin-top:28px} .pv-grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));align-items:start}</style></head>
<body>
<div class="pv-block"><span class="pv-label">Варіанти · h-9</span><div class="pv-row">
<button class="cf-btn"><span class="cf-icon cf-icon--plus cf-icon--4" aria-hidden="true"></span>Нове звернення</button><button class="cf-btn cf-btn--destructive">Видалити</button><button class="cf-btn cf-btn--outline">Фільтри</button>
<button class="cf-btn cf-btn--secondary">Скасувати</button><button class="cf-btn cf-btn--ghost">Скинути</button><button class="cf-btn cf-btn--link">Детальніше</button></div></div>
<div class="pv-block"><span class="pv-label">Розміри та стани</span><div class="pv-row">
<button class="cf-btn cf-btn--sm">Маленька</button><button class="cf-btn">Звичайна</button><button class="cf-btn cf-btn--lg">Велика</button>
<button class="cf-btn cf-btn--outline cf-btn--icon" aria-label="Визначити поточне місцезнаходження"><span class="cf-icon cf-icon--locate-fixed cf-icon--4" aria-hidden="true"></span></button>
<button class="cf-btn cf-btn--ghost cf-btn--icon cf-btn--round" aria-label="Закрити"><span class="cf-icon cf-icon--x-lucide cf-icon--4" aria-hidden="true"></span></button><button class="cf-btn cf-btn--outline cf-btn--icon-gap" type="button"><span class="cf-icon cf-icon--sliders-horizontal cf-icon--4" aria-hidden="true"></span>Фільтри<span class="cf-btn__count">2</span></button><button class="cf-btn" disabled>Вимкнена</button>
<button class="cf-btn cf-btn--icon-gap" disabled><span class="cf-icon cf-icon--loader cf-icon--4 cf-spin" aria-hidden="true"></span>Збереження...</button></div></div>
<div class="pv-block"><span class="pv-label">AppLink</span><div class="pv-row"><a class="cf-applink" href="#">Перейти до панелі</a><a class="cf-applink cf-applink--soft" href="#">Мої звернення</a></div></div>

</body>
</html>
